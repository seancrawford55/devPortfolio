<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projects and recent GitHub activity by Sean Crawford — full stack web developer."
    />
    <title>Projects — Sean Crawford</title>
  </head>
  <body>
    <header data-layout="header"></header>
    <main>
      <section class="repos">
        <div class="container">
          <p class="eyebrow">live from github</p>
          <h2 class="repos__heading">what I'm working on</h2>

          <div class="filter-rail mono" role="group" aria-label="Filter repos by last touched" data-filter>
            <button class="filter-rail__btn is-active" type="button" data-window="year">last year</button>
            <button class="filter-rail__btn" type="button" data-window="all">all</button>
          </div>

          <div class="repo-list" data-repos>
            <p class="status">loading repos…</p>
          </div>
        </div>
      </section>

      <section class="activity">
        <div class="container">
          <p class="eyebrow">activity log</p>
          <h2 class="activity__heading">recent activity</h2>

          <div class="activity-list" data-events>
            <p class="status">loading activity…</p>
          </div>
        </div>
      </section>
    </main>
    <footer data-layout="footer"></footer>
    <script type="module" src="/src/projects.ts"></script>
  </body>
</html>
