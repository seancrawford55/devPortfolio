<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Resume for Sean Crawford — IT professional and full stack web developer in Baton Rouge, LA."
    />
    <title>Resume — Sean Crawford</title>
  </head>
  <body>
    <header data-layout="header"></header>
    <main>
      <section class="resume">
        <div class="container">
          <p class="eyebrow">resume</p>
          <h2 class="resume__heading">experience</h2>

          <div class="resume__block">
            <h3 class="resume__subheading">Work</h3>
            <div class="cards" data-experience></div>
          </div>

          <div class="resume__block">
            <h3 class="resume__subheading">Education</h3>
            <div class="cards" data-education></div>
          </div>

          <div class="resume__block">
            <h3 class="resume__subheading">Skills</h3>
            <div class="skill-groups" data-skills></div>
          </div>
        </div>
      </section>
    </main>
    <footer data-layout="footer"></footer>
    <script type="module" src="/src/resume.ts"></script>
  </body>
</html>
